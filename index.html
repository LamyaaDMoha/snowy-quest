<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snowy Quest</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(
        #10192e, #284766, #91c9e5
      );
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .menu {
      padding: 40px;
    }

    h1 {
      font-size: 55px;
      color: #e1f5ff;
      text-shadow: 0 0 20px #87cfff;
    }

    p {
      color: #d4eaf9;
      font-size: 18px;
    }

    button {
      background: #a6cfff;
      color: #182d49;
      border: none;
      padding: 15px 40px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 25px;
    }

    button:hover {
      background: #d9bfff;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="menu">
    <h1>SNOWY QUEST</h1>
    <p>A Journey Through the Frozen World</p>

    <button onclick="startGame()">Start Adventure</button>
  </div>

  <script>
    function startGame() {
      alert("Your adventure is about to begin!");
    }
  </script>

</body>
</html>
